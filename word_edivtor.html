<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WPS 文档编辑器 (模式切换版)</title>
    <style>
        /* === 全局变量与基础设置 === */
        :root {
            --theme-blue: #448aff;
            --bg-gray: #f0f2f5;
            --toolbar-bg: #ffffff;
            --text-primary: #333333;
            --text-secondary: #666666;
            --border-color: #e1e3e5;
        }

        body {
            font-family: 'Microsoft YaHei', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            margin: 2;
            background-color: var(--bg-gray);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* === 顶部 Ribbon 风格工具栏 === */
        .ribbon-container {
            background-color: var(--toolbar-bg);
            border-bottom: 2px solid var(--border-color);
            flex-shrink: 0;
            user-select: none;
        }

        .title-bar {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            font-size: 30px;
            border-bottom: 1.5px solid #f5f5f5;
        }
        .app-title { font-weight: bold; color: var(--theme-blue); margin-right: 20px; }
        .file-info { font-size: 12px; color: var(--text-secondary); }

        .ribbon-tabs {
            display: flex;
            padding: 0 10px;
            border-bottom: 1px solid var(--border-color);
        }
        .ribbon-tab {
            padding: 8px 15px;
            font-size: 15px;
            cursor: pointer;
            color: var(--text-primary);
            position: relative;
        }
        .ribbon-tab.active {
            color: var(--theme-blue);
            font-weight: bold;
        }
        .ribbon-tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: var(--theme-blue);
        }

        .ribbon-toolbar {
            padding: 10px 20px;
            display: flex;
            align-items: center;
            height: 50px;
        }
        
        .tool-group {
            display: flex;
            padding-right: 15px;
            margin-right: 15px;
            border-right: 1px solid var(--border-color);
            align-items: center;
        }
        .tool-group:last-child { border-right: none; }

        .ribbon-btn {
            background: none;
            border: 1px solid transparent;
            padding: 6px 12px;
            margin: 0 2px;
            cursor: pointer;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 16px;
            color: var(--text-primary);
            transition: all 0.2s;
        }
        .ribbon-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .ribbon-btn .icon {
            font-size: 20px;
            margin-bottom: 4px;
            color: var(--theme-blue);
        }
        .ribbon-btn:hover:not(:disabled) {
            background-color: #ecf4ff;
            border-color: #cce4ff;
        }
        .ribbon-btn:active:not(:disabled) {
            background-color: #daecff;
        }
        .ribbon-btn.mode-active {
            background-color: var(--theme-blue);
            color: white;
        }
        .ribbon-btn.mode-active .icon {
            color: white;
        }

        /* === 主体内容区 === */
        .main-content {
            flex-grow: 1;
            overflow-y: auto;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
            position: relative;
        }

        .paper-sheet {
            width: 800px;
            min-height: 1100px;
            background-color: #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            padding: 60px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            cursor: text;
        }

        #editor {
            flex-grow: 1;
            width: 100%;
            border: none;
            resize: none;
            font-size: 16px;
            line-height: 1.8;
            outline: none;
            font-family: 'Times New Roman', '宋体', serif;
            color: #222;
            background: transparent;
            padding: 0;
            white-space: pre-wrap;
        }
        #editor::placeholder {
            color: #999;
            font-family: 'Microsoft YaHei', sans-serif;
            font-style: italic;
        }

        /* === 侧边栏及状态栏样式保持不变 === */
        /* ... 历史记录 sidebar 样式 ... */
        .history-sidebar {
            position: fixed;
            top: 106px;
            right: -320px;
            bottom: 24px;
            width: 320px;
            background-color: #fff;
            box-shadow: -2px 0 10px rgba(0,0,0,0.05);
            z-index: 100;
            transition: right 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            flex-direction: column;
        }
        .history-sidebar.active { right: 0; }

        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .close-btn { cursor: pointer; padding: 5px; font-size: 18px; color: #999; }

        .history-list { flex-grow: 1; overflow-y: auto; padding: 10px 0; }
        .history-item {
            padding: 12px 20px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .history-item:hover { background-color: #f9faff; }
        .history-ver { font-weight: bold; font-size: 14px; margin-bottom: 5px; }
        .history-meta { font-size: 12px; color: var(--text-secondary); }

        .status-bar {
            height: 35px;
            background-color: var(--toolbar-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 15px;
            font-size: 12px;
            color: var(--text-secondary);
            justify-content: space-between;
            flex-shrink: 0;
            user-select: none;
        }
        .status-item { margin-right: 20px; }
    </style>
</head>
<body>

    <div class="ribbon-container">
        <div class="title-bar">
            <span class="app-title">WPS 文档编辑器</span>
            <span class="file-info" id="file-name-display">未命名文档</span>
        </div>
        <div class="ribbon-tabs">
            <div class="ribbon-tab active">开始</div>
            <div class="ribbon-btn">插入</div>
            <div class="ribbon-btn">页面布局</div>
            <div class="ribbon-btn">引用</div>
            <div class="ribbon-btn">公式</div>
            <div class="ribbon-btn">数据</div>
            <div class="ribbon-btn">审阅</div>
            <div class="ribbon-btn">视图</div>
            <div class="ribbon-btn">工具</div>
            <div class="ribbon-btn">会员专享</div>
            <div class="ribbon-btn">效率</div>
        </div>
        <div class="ribbon-toolbar">
            <div class="tool-group">
                <input type="file" id="txt-file-input" accept=".txt" style="display: none;">
                <button class="ribbon-btn" onclick="document.getElementById('txt-file-input').click()">
                    <span class="icon">📂</span>
                    <span>打开文件</span>
                </button>
            </div>
            
            <div class="tool-group">
                <button class="ribbon-btn" id="mode-toggle-btn" onclick="toggleMode()">
                    <span class="icon">📝</span>
                    <span id="mode-text">working</span>
                </button>
            </div>

            <div class="tool-group">
                <button class="ribbon-btn" onclick="toggleHistorySidebar()">
                    <span class="icon">🕒</span>
                    <span>历史记录</span>
                </button>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="paper-sheet" onclick="document.getElementById('editor').focus()">
            <textarea id="editor" placeholder="请先上传 TXT 文件..." disabled></textarea>
        </div>

        <div id="history-sidebar" class="history-sidebar">
            <div class="sidebar-header">
                <span>历史修改记录 </span>
                <span class="close-btn" onclick="toggleHistorySidebar()">×</span>
            </div>
            <div class="history-list">
                <div class="history-item" style="background-color: #f0f7ff; border-left: 3px solid var(--theme-blue);">
                    <div class="history-ver">版本：v3.1 (当前)</div>
                    <div class="history-meta">2025-11-23 22:15 | Dlrow</div>
                </div>
                <div class="history-item">
                    <div class="history-ver">版本：v3.0</div>
                    <div class="history-meta">2025-11-23 18:30 | 顾清不是清</div>
                </div>
                <div class="history-item">
                    <div class="history-ver">版本：v3.0</div>
                    <div class="history-meta">2025-11-23 18:30 | 白子伍</div>
                </div>
                <div class="history-item">
                    <div class="history-ver">版本：v2.5</div>
                    <div class="history-meta">2025-11-22 10:15 | Relu</div>
                </div>
            </div>
        </div>
    </div>

    <div class="status-bar">
        <div>
            <span class="status-item">页面: 1/1</span>
            <span class="status-item" id="char-count">字符数: 0</span>
        </div>
        <div>
            <span class="status-item">WPS AI</span>
            <span class="status-item">100%</span>
        </div>
    </div>

<script>
    const txtFileInput = document.getElementById('txt-file-input');
    const editor = document.getElementById('editor');
    const fileNameDisplay = document.getElementById('file-name-display');
    const charCountDisplay = document.getElementById('char-count');
    const sidebar = document.getElementById('history-sidebar');
    const modeToggleBtn = document.getElementById('mode-toggle-btn');
    const modeText = document.getElementById('mode-text');

    let uploadedContent = ''; 
    let viewLength = 0; // 核心变量：打字模式下，当前应该显示多少个字
    let isComposing = false; 
    
    let currentMode = 'TYPING'; // 模式状态: 'TYPING' (打字同步模式) 或 'WORD' (自由输入模式)
    let typingModeContent = ''; // 存储从 TXT 同步出来的最终内容
    let wordModeContent = '';   // 存储在 WORD 模式下自由输入的内容

    // 默认设置按钮文本和禁用状态
    modeText.textContent = 'working mode~'; // 初始文本，提示将要切换到的模式
    modeToggleBtn.disabled = true;

    function toggleHistorySidebar() {
        sidebar.classList.toggle('active');
    }

    // === 模式切换函数 ===
    function toggleMode() {
        if (!uploadedContent) {
            alert('请先上传 TXT 文件才能切换模式。');
            return;
        }

        if (currentMode === 'TYPING') {
            // 1. 从 TYPING (working mode) 切换到 WORD (happy mode)
            
            typingModeContent = editor.value; // 保存当前的同步内容
            
            currentMode = 'WORD';
            modeToggleBtn.classList.add('mode-active');
            
            // 切换后的按钮文本：提示用户将切回打字模式
            modeText.textContent = 'happy mode~'; 
            
            // 加载 Word 模式的内容
            editor.value = wordModeContent;
            editor.placeholder = "working mode~";
            
        } else {
            // 2. 从 WORD (happy mode) 切换回 TYPING (working mode)
            
            wordModeContent = editor.value; // 保存自由输入的内容
            
            currentMode = 'TYPING';
            modeToggleBtn.classList.remove('mode-active');
            
            // 切换后的按钮文本：提示用户将切到自由模式
            modeText.textContent = 'working mode~'; 

            // 恢复打字模式的内容
            editor.value = typingModeContent;
            viewLength = typingModeContent.length; 
            editor.placeholder = "working mode~";
        }
        
        // 确保光标在末尾并更新 UI
        renderContent(true); 
        updateUI();
        editor.focus();
    }

    // 1. 文件读取 (仅处理 TXT)
    txtFileInput.addEventListener('change', (event) => {
        const file = event.target.files[0];
        if (!file) return;

        if (file.name.split('.').pop().toLowerCase() !== 'txt') {
            alert('请上传文本文件（.txt）！');
            return;
        }

        const reader = new FileReader();
        reader.onload = (e) => {
            uploadedContent = e.target.result;
            // 重置状态
            currentMode = 'TYPING'; // 确保在加载文件后回到打字模式
            viewLength = 0;
            editor.value = '';
            editor.disabled = false;
            editor.placeholder = "文档已加载。请开始输入以同步文件内容...";
            typingModeContent = ''; 
            wordModeContent = ''; // 每次加载新文件，清空自由模式的历史输入

            fileNameDisplay.textContent = file.name;
            updateUI();
            editor.focus();
            
            // 启用模式切换按钮
            modeToggleBtn.disabled = false;
        };
        reader.readAsText(file, 'UTF-8');
    });

    // 2. 核心：监听 Keydown 处理删除 (只允许 Backspace) 和 Tab 切换模式
    editor.addEventListener('keydown', (e) => {
        if (!uploadedContent) return;

        // *** Tab 键监听逻辑：直接触发模式切换 ***
        if (e.key === 'Tab') {
            e.preventDefault(); // 阻止浏览器默认行为
            toggleMode();       // 触发模式切换
            return;
        }
        // *** Tab 键逻辑结束 ***

        if (currentMode === 'WORD') {
            // Word/happy mode 下，允许所有键盘操作 (不干预 Backspace/Delete)
            return;
        }
        
        // 以下是 TYPING/working mode 逻辑 (打字同步)
        if (e.key === 'Backspace') {
            e.preventDefault(); 
            if (viewLength > 0) {
                viewLength--; 
                renderContent();
            }
        }
        else if (e.key === 'Delete') {
            e.preventDefault(); 
        }
    });

    // 3. 核心：中文输入法流程控制 (仅 TYPING 模式生效)
    editor.addEventListener('compositionstart', () => {
        if (currentMode === 'TYPING') {
            isComposing = true;
        }
    });

    editor.addEventListener('compositionend', (e) => {
        if (currentMode === 'WORD') return;
        
        isComposing = false;
        if (!uploadedContent) return;

        const addedLength = e.data ? e.data.length : 0;
        viewLength += addedLength;
        
        renderContent();
    });

    // 4. 核心：普通输入（英文、数字、符号）及粘贴 (不同模式逻辑不同)
    editor.addEventListener('input', (e) => {
        if (currentMode === 'WORD') {
            // Word/happy mode 下，同步内容到 Word 存储变量
            wordModeContent = editor.value;
            updateUI();
            return;
        }

        // TYPING/working mode 逻辑
        if (!uploadedContent || isComposing) return;

        const inputType = e.inputType;

        if (inputType && (inputType.startsWith('insert') || inputType === 'historyUndo')) {
            const addedLength = e.data ? e.data.length : 1; 
            
            viewLength += addedLength;
            renderContent();
        }
    });

    // 5. 渲染函数：根据模式强制刷新显示内容和光标位置
    function renderContent(forceCursorUpdate = false) {
        
        if (currentMode === 'TYPING') {
            if (!uploadedContent) return;

            // 边界检查
            if (viewLength < 0) viewLength = 0;
            if (viewLength > uploadedContent.length) viewLength = uploadedContent.length;

            const txtToShow = uploadedContent.substring(0, viewLength);
            editor.value = txtToShow;
            
            // 确保光标在最后
            editor.scrollTop = editor.scrollHeight;
            editor.selectionStart = editor.selectionEnd = editor.value.length;
        } else if (forceCursorUpdate) {
            // Word/happy mode 下，仅需要保证光标在末尾
            editor.scrollTop = editor.scrollHeight;
            editor.selectionStart = editor.selectionEnd = editor.value.length;
        }

        updateUI();
    }

    function updateUI() {
        if (currentMode === 'TYPING') {
            charCountDisplay.textContent = `字符数: ${viewLength} / ${uploadedContent.length}`;
            
            // 更新标题栏信息
            let baseName = uploadedContent.length > 0 ? uploadedContent.split('\n')[0].substring(0, 10) + '...' : '未命名文档';
            
            // 使用您指定的模式名称：working mode~
            let modeDisplay = ' (working mode~)';
            if (viewLength >= uploadedContent.length && uploadedContent.length > 0) {
                 modeDisplay = ' (working mode~ - 完成)';
            }
            fileNameDisplay.textContent = baseName + modeDisplay;

            // 更新模式按钮文本（提示将要切到哪个模式）
            modeText.textContent = 'happy mode~';

        } else {
            // Word/happy mode 下显示当前输入的字数
            charCountDisplay.textContent = `字符数: ${editor.value.length}`;
            let baseName = uploadedContent.length > 0 ? uploadedContent.split('\n')[0].substring(0, 10) + '...' : '未命名文档';
            
            // 使用您指定的模式名称：happy mode~
            fileNameDisplay.textContent = baseName + ' (happy mode~)';

            // 更新模式按钮文本（提示将要切到哪个模式）
            modeText.textContent = 'working mode~';
        }
    }
    
    // 阻止右键，增加沉浸感
    editor.addEventListener('contextmenu', (e) => e.preventDefault());

    // 初始设置按钮文本
    updateUI(); 

</script>

</body>
</html>
